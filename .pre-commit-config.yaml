# SwingQuant TITAN — pre-commit hooks
# ─────────────────────────────────────────────────────────────────
# Activation locale (une fois par clone) :
#   pip install pre-commit && pre-commit install
#
# Les hooks tournent à chaque `git commit`. Pour désactiver ponctuellement :
#   git commit --no-verify   (à éviter — préférer corriger le hook)
#
# Aligné sur la CI : ruff (backend) + check secrets + safety basique fichiers.
# ─────────────────────────────────────────────────────────────────
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^frontend/src/api/(types\.ts|openapi\.json)$'
      - id: end-of-file-fixer
        exclude: '^frontend/src/api/(types\.ts|openapi\.json)$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: '^backend/(modules|tests|scripts)/.*\.py$|^backend/(api|tracker|main|config)\.py$'

  # detect-secrets désactivé tant que .secrets.baseline n'est pas généré.
  # Pour activer :
  #   pip install detect-secrets
  #   detect-secrets scan > .secrets.baseline
  #   décommenter le bloc ci-dessous, puis `pre-commit run -a`
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', '.secrets.baseline']
  #       exclude: 'package-lock\.json|frontend/src/api/.*'
