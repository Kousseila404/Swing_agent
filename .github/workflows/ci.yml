name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check modules/ tests/ api.py tracker.py

      - name: Mypy strict (modules whitelistés dans mypy.ini)
        # Hard fail : tout module ajouté à la section [mypy-modules.X] strict
        # de mypy.ini doit rester sans erreur. Élargir la liste à mesure que
        # les modules sont nettoyés.
        run: mypy --config-file mypy.ini modules/portfolio/_utils.py

      - name: Pytest (avec seuil coverage 55%)
        run: pytest tests/ --cov=modules --cov-config=.coveragerc --cov-report=term --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint (soft — durcir quand le WIP métier sera commité)
        run: npm run lint
        continue-on-error: true

      - name: Vitest (suite frontend complète)
        run: npm test

      - name: OpenAPI → TS drift check
        # Échoue si frontend/src/api/types.ts diverge du backend OpenAPI.
        # Désactivable si le backend n'est pas dispo en CI.
        run: npm run check:types
        continue-on-error: true

      - name: Build
        run: npm run build

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t swingquant-backend:ci ./backend
