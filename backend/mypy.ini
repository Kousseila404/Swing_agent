[mypy]
# SwingQuant TITAN — mypy config (durcissement progressif)
# ─────────────────────────────────────────────────────────────────
# Stratégie : strict sur les modules critiques (risk, utils, support_score),
# soft partout ailleurs. À chaque module qu'on consolide, on l'ajoute
# à la liste strict ci-dessous.
# ─────────────────────────────────────────────────────────────────
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (?x)(
      ^venv/
    | ^tests/
    | ^scripts/
    | ^\.archive/
    | ^data/
  )

# ── Modules en mode strict ─────────────────────────────────────
# Liste à étendre progressivement. Pour ajouter un module :
#   1. mypy --config-file mypy.ini modules/<x>.py    → fixer les erreurs
#   2. ajouter `[mypy-modules.<x>]` strict ci-dessous
#   3. le bloc strict bloquera les régressions futures
#
# Modules à durcir prioritairement quand leur WIP sera commité :
#   modules.risk, modules.utils (déjà ciblés par la CI soft)

[mypy-modules.portfolio._utils]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True

# Tout le package portfolio/ est clean (audit 2026-05-29 — 1 erreur de narrowing
# corrigée dans _trade_levels.py). Gaté en strict pour bloquer les régressions.
[mypy-modules.portfolio.*]
disallow_incomplete_defs = True
warn_return_any = True

# Note : modules/risk.py, modules/utils.py, modules/yf_circuit_breaker.py
# ont 1-2 trous chacun (annotations manquantes ou `type: ignore` obsolètes).
# À durcir module par module au fil du nettoyage. Les modules récents
# (support_score, delisted) seront ajoutés à cette whitelist quand le
# WIP métier sera commité sur main.
