[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --disable-warnings
markers =
    slow: tests lents (> 2s)
    integration: nécessite DB/yfinance/broker
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
